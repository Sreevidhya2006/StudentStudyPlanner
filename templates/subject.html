<!DOCTYPE html>
<html>
<head>
    <title>Add Subject - Student Study Planner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>📚 Add New Subject</h1>

        <p>Add a subject to organize your study tasks.</p>

        <form method="POST">

            <input
                type="text"
                name="subject"
                placeholder="Enter Subject Name"
                required
            >

            <br><br>

            <button type="submit">➕ Add Subject</button>

        </form>

        <br>

        <a href="/dashboard">
            <button>⬅ Back to Dashboard</button>
        </a>

    </div>

</body>
</html>
